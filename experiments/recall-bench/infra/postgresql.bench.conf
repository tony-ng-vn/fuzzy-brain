# Server tuning for the disposable recall-bench cluster (DESIGN.md section 7,
# overridden by the section 12 addendum: native Postgres, no Docker VM to
# split the host's 24 GB with, so shared_buffers is 6GB here, not 8GB).
# Appended to the bench cluster's postgresql.conf by infra/pg-up.sh; never
# applied to the managed Polygres database.

shared_buffers = 6GB
effective_cache_size = 16GB
work_mem = 32MB
maintenance_work_mem = 6GB
max_connections = 200
random_page_cost = 1.1
jit = off                            # JIT compilation costs more than it saves on sub-10ms queries
max_parallel_workers_per_gather = 0  # at ~100 concurrent clients, intra-query parallelism only adds contention
max_parallel_maintenance_workers = 7 # index builds are the exception: they want every core
synchronous_commit = off
