<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>fuzzy-brain face scatter studio</title>
<style>
  body { margin: 0; background: #05070f; color: #eaf1ff; font-family: system-ui, sans-serif; overflow: hidden; }
  #ui { position: absolute; top: 16px; left: 16px; z-index: 2; background: rgba(4,8,18,0.88); padding: 14px 16px; border-radius: 8px; border: 1px solid #2a3350; width: 270px; }
  #ui p { margin: 0 0 8px; font-size: 13px; color: #9aa7c7; }
  label { display: block; font-size: 12px; color: #9aa7c7; margin-top: 10px; }
  input[type=range] { width: 100%; }
  #status { font-size: 12px; color: #5c6788; margin-top: 10px; white-space: pre-wrap; }
  #dlBtn, #frontBtn { margin-top: 12px; margin-right: 8px; display: none; padding: 6px 12px; background: rgba(120,150,220,0.12); color: #b9a6ff; border: 1px solid rgba(120,150,220,0.3); border-radius: 6px; cursor: pointer; font-size: 12px; }
  #hint { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #5c6788; z-index: 2; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.166.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.166.0/examples/jsm/"
} }
</script>
</head>
<body>
  <div id="ui">
    <p>scatter portrait: aligned only from the front</p>
    <input type="file" id="photoInput" accept="image/*">
    <label>drone spacing <span id="pitchVal">16</span>px
      <input type="range" id="pitch" min="8" max="32" value="16"></label>
    <label>point size <span id="sizeVal">4</span>
      <input type="range" id="size" min="1" max="12" step="0.5" value="4"></label>
    <label>scatter depth <span id="scatterVal">1.8</span>
      <input type="range" id="scatter" min="0" max="4" step="0.1" value="1.8"></label>
    <label>brightness <span id="brightVal">1.1</span>
      <input type="range" id="bright" min="0.4" max="3" step="0.1" value="1.1"></label>
    <label>contrast <span id="contrastVal">2.2</span>
      <input type="range" id="contrast" min="0.5" max="3" step="0.1" value="2.2"></label>
    <div id="status">no model needed -- just a photo.</div>
    <button id="frontBtn">snap to front</button>
    <button id="dlBtn">download brain-face.json</button>
  </div>
  <p id="hint">drag to rotate, scroll to zoom. face resolves only head-on.</p>

<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  const statusEl = document.getElementById('status');
  const pitchInput = document.getElementById('pitch');
  const sizeInput = document.getElementById('size');
  const scatterInput = document.getElementById('scatter');
  const brightInput = document.getElementById('bright');
  const contrastInput = document.getElementById('contrast');
  const dlBtn = document.getElementById('dlBtn');
  const frontBtn = document.getElementById('frontBtn');

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x05070f);

  const frustum = 2.2;
  let aspect = innerWidth / innerHeight;
  const camera = new THREE.OrthographicCamera(
    -frustum * aspect / 2, frustum * aspect / 2, frustum / 2, -frustum / 2, 0.01, 100
  );
  camera.position.set(0, 0, 6);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  function makeSprite() {
    const c = document.createElement('canvas');
    c.width = c.height = 64;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, 'rgba(255,255,255,1)');
    grad.addColorStop(0.4, 'rgba(255,255,255,0.8)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grad;
    g.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(c);
  }
  const sprite = makeSprite();

  let imgData = null, imgW = 0, imgH = 0;
  let matrix = [];
  let cloud = null;

  function mulberry32(seed) {
    let s = seed;
    return function () {
      s |= 0; s = (s + 0x6D2B79F5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function isBackground(r, g, b) { return r > 232 && g > 232 && b > 232; }

  function pixelAt(x, y) {
    const i = (y * imgW + x) * 4;
    const d = imgData.data;
    return [d[i], d[i + 1], d[i + 2]];
  }

  function cellColor(cx, cy, pitch) {
    let r = 0, g = 0, b = 0, n = 0, fg = 0, total = 0;
    const half = Math.floor(pitch / 2);
    for (let y = cy - half; y <= cy + half; y += 2) {
      for (let x = cx - half; x <= cx + half; x += 2) {
        if (x < 0 || y < 0 || x >= imgW || y >= imgH) continue;
        const [pr, pg, pb] = pixelAt(x, y);
        total++;
        if (isBackground(pr, pg, pb)) continue;
        fg++;
        r += pr; g += pg; b += pb; n++;
      }
    }
    if (n === 0 || fg / total < 0.35) return null;
    return [Math.round(r / n), Math.round(g / n), Math.round(b / n)];
  }

  function buildMatrix() {
    const pitch = Number(pitchInput.value);
    document.getElementById('pitchVal').textContent = pitch;
    const rand = mulberry32(20260708);
    const pts = [];
    let row = 0;
    for (let y = Math.floor(pitch / 2); y < imgH; y += pitch, row++) {
      const offset = (row % 2) * Math.floor(pitch / 2);
      for (let x = Math.floor(pitch / 2) + offset; x < imgW; x += pitch) {
        const color = cellColor(x, y, pitch);
        const zRand = rand();
        if (!color) continue;
        pts.push({
          x: x / imgW,
          y: y / imgH,
          zScatter: zRand - 0.5,
          r: color[0], g: color[1], b: color[2],
        });
      }
    }
    matrix = pts;
  }

  // Contrast pivots around mid-grey, then brightness scales the result.
  // Contrast is what separates hair from skin; brightness is what makes the
  // additive glow read on a dark sky.
  function grade(v, contrast, brightness) {
    const c = ((v / 255 - 0.5) * contrast + 0.5) * brightness;
    return Math.min(1, Math.max(0, c));
  }

  function rebuildCloud() {
    if (!matrix.length) return;
    const scatter = Number(scatterInput.value);
    const brightness = Number(brightInput.value);
    const contrast = Number(contrastInput.value);
    document.getElementById('scatterVal').textContent = scatter;
    document.getElementById('brightVal').textContent = brightness;
    document.getElementById('contrastVal').textContent = contrast;

    if (cloud) { scene.remove(cloud); cloud.geometry.dispose(); cloud.material.dispose(); }

    const positions = new Float32Array(matrix.length * 3);
    const colors = new Float32Array(matrix.length * 3);
    matrix.forEach((p, i) => {
      positions[i * 3] = (p.x - 0.5) * 1.6;
      positions[i * 3 + 1] = -(p.y - 0.5) * 1.6;
      positions[i * 3 + 2] = p.zScatter * scatter;
      colors[i * 3] = grade(p.r, contrast, brightness);
      colors[i * 3 + 1] = grade(p.g, contrast, brightness);
      colors[i * 3 + 2] = grade(p.b, contrast, brightness);
    });

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    // sizeAttenuation off: with an orthographic camera, attenuated size never
    // responds to zoom, which is why dense clouds dissolved into dust. Size
    // is now in pixels and scaled by camera.zoom each frame instead.
    const mat = new THREE.PointsMaterial({
      size: Number(sizeInput.value),
      sizeAttenuation: false,
      vertexColors: true, map: sprite,
      transparent: true, alphaTest: 0.05, depthWrite: false,
      blending: THREE.AdditiveBlending,
    });
    cloud = new THREE.Points(geo, mat);
    scene.add(cloud);

    statusEl.textContent = `${matrix.length} points.`;
    dlBtn.style.display = 'inline-block';
    frontBtn.style.display = 'inline-block';
  }

  frontBtn.addEventListener('click', () => {
    camera.position.set(0, 0, 6);
    camera.zoom = 1;
    camera.updateProjectionMatrix();
    controls.target.set(0, 0, 0);
    controls.update();
  });

  dlBtn.addEventListener('click', () => {
    const payload = {
      settings: {
        pitch: Number(pitchInput.value),
        scatter: Number(scatterInput.value),
        pointSize: Number(sizeInput.value),
        brightness: Number(brightInput.value),
        contrast: Number(contrastInput.value),
        mode: 'anamorphic-scatter',
      },
      points: matrix.map((p) => ({
        x: p.x, y: p.y, zScatter: p.zScatter,
        color: `rgb(${p.r},${p.g},${p.b})`,
      })),
    };
    const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'brain-face.json';
    a.click();
  });

  document.getElementById('photoInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const img = new Image();
    img.src = URL.createObjectURL(file);
    await new Promise((res) => { img.onload = res; });
    imgW = img.naturalWidth; imgH = img.naturalHeight;
    const off = document.createElement('canvas');
    off.width = imgW; off.height = imgH;
    const octx = off.getContext('2d', { willReadFrequently: true });
    octx.drawImage(img, 0, 0);
    imgData = octx.getImageData(0, 0, imgW, imgH);
    buildMatrix();
    rebuildCloud();
  });

  pitchInput.addEventListener('input', () => { if (imgData) { buildMatrix(); rebuildCloud(); } });
  sizeInput.addEventListener('input', () => {
    document.getElementById('sizeVal').textContent = sizeInput.value;
    if (cloud) cloud.material.size = Number(sizeInput.value);
  });
  scatterInput.addEventListener('input', rebuildCloud);
  brightInput.addEventListener('input', rebuildCloud);
  contrastInput.addEventListener('input', rebuildCloud);

  addEventListener('resize', () => {
    aspect = innerWidth / innerHeight;
    camera.left = -frustum * aspect / 2;
    camera.right = frustum * aspect / 2;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  renderer.setAnimationLoop(() => {
    controls.update();
    if (cloud) cloud.material.size = Number(sizeInput.value) * camera.zoom;
    renderer.render(scene, camera);
  });
</script>
</body>
</html>
